# Type-check python/ against MicroPython (not CPython): scripts/typecheck.py
[mypy]
# MicroPython stdlib stubs (asyncio.sleep_ms, time.ticks_ms, ...) replace CPython's typeshed.
custom_typeshed_dir = .typings
# Our `bsp` C module stub, the MicroPython port stubs (machine, esp32, network, framebuf), the app.
mypy_path = stubs:.typings:python
explicit_package_bases = True
files = python
platform = linux
python_version = 3.10

strict = True
warn_unused_ignores = True
# Errors inside the third-party MicroPython stubs themselves are not ours to fix.
[mypy-machine,network,vfs,esp32,framebuf,_mpy_shed.*]
ignore_errors = True

# The app's `import secrets` is the Wi-Fi config on the board, not CPython's secrets module.
[mypy-secrets]
ignore_missing_imports = True
ignore_errors = True
